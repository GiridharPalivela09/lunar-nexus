name: NEXUS-LUNAR Dashboard & Pipeline Automated Validation

on:
  push:
    branches: [ nexus-unified, main ]
  pull_request:
    branches: [ nexus-unified, main ]
  workflow_dispatch:

jobs:
  validate-dashboard-and-pipeline:
    name: Run Dashboard Validation & Scientific Relevance
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright pytest pytest-timeout
          python -m playwright install --with-deps chromium

      - name: Execute Automated Validation Runner
        env:
          PYTHONPATH: .
        run: |
          python scripts/run_dashboard_validation.py --port 8000

      - name: Upload Validation Reports & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-validation-reports
          path: |
            reports/dashboard_validation_report.md
            reports/dashboard_validation_report.json
            reports/test_traceability.md
